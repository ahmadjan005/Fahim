name: Build Fahim APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Pick source (latest uploaded zip, or repo files)
        run: |
          SRC="$GITHUB_WORKSPACE"
          NEWEST=""; NEWT=0
          while IFS= read -r -d '' f; do
            t=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            [ -z "$t" ] && t=0
            if [ "$t" -ge "$NEWT" ]; then NEWT=$t; NEWEST="$f"; fi
          done < <(find . -path ./.git -prune -o -type f -iname '*.zip' -print0)
          if [ -n "$NEWEST" ]; then
            echo "Using zip: $NEWEST"
            rm -rf /tmp/src && mkdir -p /tmp/src
            unzip -q -o "$NEWEST" -d /tmp/src
            IDX=$(find /tmp/src -path '*/web/index.html' | head -1)
            if [ -n "$IDX" ]; then SRC=$(dirname "$(dirname "$IDX")"); fi
          else
            echo "No zip found, using repo files"
          fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "Building from: $SRC"
      - name: Copy web game into assets
        run: |
          mkdir -p "$SRC/android/app/src/main/assets/www"
          cp -r "$SRC"/web/* "$SRC/android/app/src/main/assets/www/"
      - name: Build APK
        run: |
          cd "$SRC/android"
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/fahim.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Fahim-APK
          path: fahim.apk
